name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      working-directory: ./app

    - name: Build debug APK
      run: ./gradlew assembleDebug
      working-directory: ./app

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: MultiTube-APK
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Create Release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ github.run_number }}
        name: MultiTube v${{ github.run_number }}
        body: |
          MultiTube Android App - Play multiple YouTube videos simultaneously
          
          Features:
          - Multiple YouTube video playback (up to 16 simultaneous)
          - Grid layout (1x1, 2x2, 3x3, 4x4)
          - Add videos by URL or Video ID
          - Master playback controls
          - Audio focus management
          - Picture-in-Picture support
        files: app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
